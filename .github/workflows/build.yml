name: Сборка APK и Windows

# Пуш в main собирает APK и установщик Windows. Если релиза с номером версии
# из package.json еще нет, он создается автоматически. Чтобы выпустить новую
# версию, поднимите "version" в package.json.
on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK для Android
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Ключ подписи из секретов
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Без ключа релиз в main не собирается
        if: env.KEYSTORE_B64 == '' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64. Добавьте 4 секрета подписи в Settings, Secrets and variables, Actions."
          exit 1
      - name: Сборка APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Имя файла
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          SUFFIX=""
          [ -z "$KEYSTORE_B64" ] && SUFFIX="-unsigned"
          mkdir -p out && cp "$SRC" "out/TermoOpros-$VERSION$SUFFIX.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Установщик Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Имя файла
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          mkdir -p out && cp "$SRC" "out/TermoOpros-$VERSION-setup.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe
          if-no-files-found: error

  release:
    name: Релиз на GitHub
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия и проверка релиза
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Релиз v$VERSION уже есть, новый не создается."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ТермоОпрос ${{ steps.v.outputs.version }}
          files: out/*
          body: |
            Сайт: https://thermo-poll.whiskm.workers.dev/

            **Android.** Скачайте `TermoOpros-${{ steps.v.outputs.version }}.apk` и откройте файл. Телефон попросит разрешить установку из этого источника: разрешите и нажмите «Установить». Обновление ставится поверх старой версии, прогресс сохраняется.

            **Windows 10 и 11.** Скачайте `TermoOpros-${{ steps.v.outputs.version }}-setup.exe` и запустите. Если появится окно SmartScreen «Windows защитила ваш компьютер», нажмите «Подробнее», затем «Выполнить в любом случае». Права администратора не нужны.

            Прогресс хранится на каждом устройстве отдельно. Перенос: Настройки, «Сохранить все в файл» на одном устройстве и «Загрузить из файла» на другом.
